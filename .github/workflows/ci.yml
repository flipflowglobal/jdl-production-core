name: CI

# Explicit list form is the most parser-robust trigger spec.
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install package
        run: pip install -e python/
      - name: Full test suite (jdl test — same command a local install runs)
        run: jdl test

  rust:
    name: Rust hotpath
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Use the rustup toolchain pre-installed on ubuntu-latest runners rather than
      # a third-party setup action — org Actions policies can restrict non-GitHub
      # actions, which fails the whole run at startup. Only actions/* are used here.
      - name: Ensure clippy component
        run: rustup component add clippy
      - name: Cache cargo dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            rust/hotpath/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/hotpath/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo test
        working-directory: rust/hotpath
        run: cargo test
      - name: cargo clippy
        working-directory: rust/hotpath
        run: cargo clippy --all-targets -- -D warnings

  node:
    name: Node server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'node/package-lock.json'
      - name: Install deps
        working-directory: node
        run: npm ci || npm install
      - name: npm test
        working-directory: node
        run: npm test

  solidity:
    name: Solidity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job is GATING. It was previously continue-on-error to tolerate a
    # transient solc-download/peer-resolution hiccup, but that also silently hid
    # a hard build break: a dependency bump pulled in hardhat-toolbox v7 (a
    # deprecation stub that loads under neither Hardhat 2 nor 3) and `npm run
    # compile` exited 1 on every run without ever failing the pipeline. A
    # genuinely flaky compile is worth a re-run; an invisible broken build in the
    # component that moves funds is not. The fork-test step below is the one part
    # left non-gating, because it reaches a public RPC endpoint.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: 'contracts/package-lock.json'
      - name: Install deps
        working-directory: contracts
        run: npm ci || npm install
      - name: Compile contracts (Hardhat + solc 0.8.20)
        working-directory: contracts
        run: npm run compile
      # Mainnet-fork tests against Arbitrum One. These exercise the real
      # crypto-moving path (Aave flashLoanSimple → Uniswap swaps →
      # profit-or-revert) with no broadcast and no real funds. Kept
      # non-gating at the step level because it forks from a public RPC
      # (ARB_RPC_URL secret if set, else arb1.arbitrum.io) which can rate-limit;
      # the compile step above is what gates. Uses the same command a
      # developer runs locally.
      - name: Mainnet-fork tests (advisory — depends on a public RPC)
        working-directory: contracts
        continue-on-error: true
        env:
          ARB_RPC_URL: ${{ secrets.ARB_RPC_URL }}
        run: npm test
