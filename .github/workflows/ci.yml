name: CI

# Explicit list form is the most parser-robust trigger spec.
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install package
        run: pip install -e python/
      - name: Full test suite (jdl test — same command a local install runs)
        run: jdl test

  rust:
    name: Rust hotpath
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Use the rustup toolchain pre-installed on ubuntu-latest runners rather than
      # a third-party setup action — org Actions policies can restrict non-GitHub
      # actions, which fails the whole run at startup. Only actions/* are used here.
      - name: Ensure clippy component
        run: rustup component add clippy
      - name: Cache cargo dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            rust/hotpath/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/hotpath/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo test
        working-directory: rust/hotpath
        run: cargo test
      - name: cargo clippy
        working-directory: rust/hotpath
        run: cargo clippy --all-targets -- -D warnings

  node:
    name: Node server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'node/package-lock.json'
      - name: Install deps
        working-directory: node
        run: npm ci || npm install
      - name: npm test
        working-directory: node
        run: npm test

  solidity:
    name: Solidity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # continue-on-error: Hardhat downloads the solc 0.8.20 binary and resolves
    # OpenZeppelin imports at compile time; if the network fetch or a peer-dep
    # resolution hiccups in CI we don't want it to fail the whole pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: 'contracts/package-lock.json'
      - name: Install deps
        working-directory: contracts
        run: npm ci || npm install
      - name: Compile contracts (Hardhat + solc 0.8.20)
        working-directory: contracts
        run: npm run compile
