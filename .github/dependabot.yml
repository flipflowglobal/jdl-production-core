version: 2

updates:
  # Python engine dependencies (python/)
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # web3 is pinned EXACTLY (6.20.4) and a major bump is never a drop-in here.
    # Two independent, silent failure modes make an automated major bump actively
    # dangerous, and both have already bitten this repo:
    #   * web3 7.0.0 renamed `geth_poa_middleware` to `ExtraDataToPOAMiddleware`
    #     and removed the old name. The engine imports it inside a
    #     try/except ImportError at module-import time, so a 7.x install sets
    #     WEB3_OK = False instead of failing loudly, and the
    #     `if CONTRACT and WEB3_OK and LIVE_EXEC` broadcast gate can never be
    #     satisfied: the daemon scans forever and never trades. Nothing in the
    #     old suite could see this (test_swarm_wiring.py force-sets
    #     WEB3_OK = True). jdl_flash/test_web3_contract.py covers it now.
    #   * web3 8.0.0 requires Python >=3.10 while this project supports 3.9, so
    #     an 8.0.0 pin is simply un-installable on a supported interpreter.
    # Minor/patch updates within the pinned 6.x line still flow normally via the
    # group above; majors are a deliberate, human-run migration. See the comment
    # above `dependencies` in python/pyproject.toml and python/requirements_flash.txt.
    ignore:
      - dependency-name: "web3"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"

  # Rust hot-path dependencies (rust/hotpath)
  - package-ecosystem: "cargo"
    directory: "/rust/hotpath"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"

  # Node.js API/orchestration server dependencies (node/)
  - package-ecosystem: "npm"
    directory: "/node"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "node"

  # Solidity/Hardhat tooling dependencies (contracts/)
  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Hardhat 3 is a breaking rewrite: ESM-only config, a different config
    # schema (plugins array, typed networks) and a different toolbox package.
    # An automated major bump to the 3.x line silently broke the contract build
    # once already, so majors here are a deliberate, human-run migration rather
    # than a Dependabot PR. Minor/patch updates within the 2.x line still flow
    # normally via the group above.
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-ethers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-chai-matchers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-network-helpers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chai"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "contracts"

  # GitHub Actions workflow dependencies (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
