version: 2

updates:
  # Python engine dependencies (python/)
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # Rust hot-path dependencies (rust/hotpath)
  - package-ecosystem: "cargo"
    directory: "/rust/hotpath"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"

  # Node.js API/orchestration server dependencies (node/)
  - package-ecosystem: "npm"
    directory: "/node"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "node"

  # Solidity/Hardhat tooling dependencies (contracts/)
  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Hardhat 3 is a breaking rewrite: ESM-only config, a different config
    # schema (plugins array, typed networks) and a different toolbox package.
    # An automated major bump to the 3.x line silently broke the contract build
    # once already, so majors here are a deliberate, human-run migration rather
    # than a Dependabot PR. Minor/patch updates within the 2.x line still flow
    # normally via the group above.
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-ethers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-chai-matchers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-network-helpers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chai"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "contracts"

  # GitHub Actions workflow dependencies (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
