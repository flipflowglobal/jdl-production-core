[package]
name = "jdl-hotpath"
version = "0.1.0"
edition = "2021"
description = "CPU hot-path for the JDL flash-loan system: fast arbitrage-cycle detection"
# Matches the repository-wide LICENSE (Business Source License 1.1). This crate
# previously declared "MIT", which contradicted that file — the repo LICENSE
# covers "the software and associated documentation files in this repository",
# this crate included.
license = "BUSL-1.1"
publish = false

# Two artifacts from one crate: a library (unit-testable core) and a CLI binary
# the Node orchestration server spawns.
[lib]
name = "jdl_hotpath"
# rlib for Rust/tests + cdylib so a C ABI can be exposed to Cython/Python.
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "jdl-hotpath"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
hex = "0.4"
sha3 = "0.12"
# Read-only JSON-RPC client for `jdl-hotpath probe` (the Rust leg of
# `jdl connectivity`). Default features are OFF: that strips the native-tls
# backend, and the `tls` feature selects pure-Rust rustls instead. Pure Rust
# matters for this crate specifically — it is built and run under Termux on
# Android, where OpenSSL is not available and any C-backed TLS dependency
# breaks the build for every consumer, not just for a test run.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = true
