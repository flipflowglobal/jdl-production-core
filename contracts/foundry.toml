[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
# Allow tests to read ARB_RPC_URL from the environment for forking.
fs_permissions = [{ access = "read", path = "./" }]

# Reuse the npm-installed OpenZeppelin (same version Hardhat uses) so there is
# only one source of OZ. Alternatively: forge install OpenZeppelin/openzeppelin-contracts@v5.0.2
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arbitrum = "${ARB_RPC_URL}"
