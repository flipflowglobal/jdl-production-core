[package]
name = "jdl-core"
version = "1.0.0"
edition = "2021"
description = "JDL Production Core — Rust hot-path acceleration CLI"

[[bin]]
name = "jdl-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha3 = "0.10"
rayon = "1"
rustc-hash = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
