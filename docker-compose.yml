services:
  gateway:
    build: .
    command: node dist/entry-gateway.js
    ports:
      - "8500:8500"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8500
      - TRADING_URL=http://trading:8501
      - WORKER_URL=http://worker:8502
    depends_on:
      - trading
      - worker
    restart: unless-stopped

  trading:
    build: .
    command: node dist/entry-trading.js
    env_file: .env
    environment:
      - NODE_ENV=production
      - TRADING_PORT=8501
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: node dist/entry-worker.js
    env_file: .env
    environment:
      - NODE_ENV=production
      - WORKER_PORT=8502
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jdl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdl}
      POSTGRES_DB: ${POSTGRES_DB:-jdl_core}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdl -d jdl_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
